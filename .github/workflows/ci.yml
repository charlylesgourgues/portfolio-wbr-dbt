name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

# A new push to the same PR cancels the previous run.
concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_DBT_CI }}
  DBT_CI_SCHEMA: dbt_pr_${{ github.event.pull_request.number }}
  DBT_PROFILES_DIR: ci

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check connection
        run: dbt debug

      - name: Build models and run tests in the PR schema
        run: dbt build --target ci
